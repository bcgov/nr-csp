# Frontend deploy template — consumed by `oc process` in reusable-deploy.yml.
#
# Cognito / Vite config is baked into the image at build time (Docker ARGs),
# so no VITE_* runtime parameters are needed here. Runtime wiring is limited to
# BACKEND_URL (tells Caddy where to proxy /api/* traffic) and COGNITO_DOMAIN /
# COGNITO_REGION (feed the CSP connect-src directive in Caddyfile).
#
# The amplify-config ConfigMap this Deployment mounts is created by
# common/openshift.init.yml (init step), where environment-scoped GitHub
# variables resolve correctly — see the note there before moving it back.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-csp-frontend-deploy
parameters:
  - name: ROLLOUT_TRIGGER
    description: Deployment run and attempt; refresh mounted runtime configuration
    value: ""
  - name: IMAGE_REF
    description: Full container image reference; tested releases use a sha256 digest
    required: true
  - name: NAME
    description: App name prefix
    value: nr-csp
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  - name: COMMIT_SHA
    description: Git commit stamped on the pod template to force a rollout per push
    value: ""
  - name: COGNITO_DOMAIN
    description: Cognito hosted UI domain (no https://)
    required: true
  - name: COGNITO_REGION
    description: AWS region for Cognito (feeds the regional cognito-idp connect-src entry)
    value: ca-central-1

objects:
  # ── Deployment ────────────────────────────────────────────
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/name: ${NAME}-frontend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-frontend-${ZONE}
            app.kubernetes.io/instance: ${ZONE}
          annotations:
            app.openshift.io/vcs-ref: ${COMMIT_SHA}
            app.openshift.io/rollout-trigger: ${ROLLOUT_TRIGGER}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          containers:
            - name: ${NAME}-frontend
              image: ${IMAGE_REF}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                # Caddy reverse-proxies /api/* to the same-zone backend Service.
                - name: BACKEND_URL
                  value: ${NAME}-backend-${ZONE}:8080
                # Caddy's Content-Security-Policy connect-src needs the Cognito
                # domain (OAuth token exchange) and region (silent token refresh
                # via the regional cognito-idp API) to allow the SPA's fetch/XHR.
                - name: COGNITO_DOMAIN
                  value: ${COGNITO_DOMAIN}
                - name: COGNITO_REGION
                  value: ${COGNITO_REGION}
                # Caddy runtime log verbosity (see Caddyfile global options).
                # Comes from the init-created ConfigMap so the value honors
                # environment-scoped GitHub variables (see openshift.init.yml).
                - name: LOG_LEVEL
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: LOG_LEVEL
              volumeMounts:
                - name: caddy-data
                  mountPath: /data
                - name: caddy-config
                  mountPath: /config
                - name: tmp
                  mountPath: /tmp
                - name: amplify-config
                  mountPath: /usr/share/caddy/amplify-config.js
                  subPath: amplify-config.js
                  readOnly: true
              resources:
                requests:
                  cpu: "20m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /health
                  port: 3000
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 5
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: caddy-data
              emptyDir: {}
            - name: caddy-config
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: amplify-config
              configMap:
                name: ${NAME}-frontend-amplify-config-${ZONE}

  # ── Service ───────────────────────────────────────────────
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-frontend-${ZONE}
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000
