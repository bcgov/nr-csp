name: Release checks

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/scripts/release-images.test.mjs
