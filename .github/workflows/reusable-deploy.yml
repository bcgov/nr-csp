# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      # Backend secrets
      spring_datasource_url:
        description: Oracle JDBC URL
        required: true
      spring_datasource_username:
        description: Oracle database username
        required: true
      spring_datasource_password:
        description: Oracle database password
        required: true
      keystore_secret:
        description: Oracle wallet init container secret
        required: true
      # Backend config
      database_host:
        description: Oracle DB hostname
        required: true
      database_service_name:
        description: Oracle service name
        required: true
      jwt_jwks_uri:
        description: JWKS endpoint for JWT validation
        required: false
      jwt_issuer:
        description: Expected JWT issuer claim
        required: false
      jwt_audience:
        description: Expected JWT audience claim
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters:
            -p ZONE='${{ inputs.target }}'
            -p NAME='${{ github.event.repository.name }}'
            -p SPRING_DATASOURCE_URL='${{ secrets.spring_datasource_url }}'
            -p SPRING_DATASOURCE_USERNAME='${{ secrets.spring_datasource_username }}'
            -p SPRING_DATASOURCE_PASSWORD='${{ secrets.spring_datasource_password }}'
            -p KEYSTORE_SECRET='${{ secrets.keystore_secret }}'
            -p DATABASE_HOST='${{ secrets.database_host }}'
            -p DATABASE_SERVICE_NAME='${{ secrets.database_service_name }}'
            -p JWT_JWKS_URI='${{ secrets.jwt_jwks_uri }}'
            -p JWT_ISSUER='${{ secrets.jwt_issuer }}'
            -p JWT_AUDIENCE='${{ secrets.jwt_audience }}'
            -p APP_ENV='${{ vars.app_env }}'
            -p COGNITO_IDP_NAME='${{ vars.cognito_idp_name }}'
            -p COGNITO_IDP_NAME_BCEID='${{ vars.cognito_idp_name_bceid }}'
            -p COGNITO_REGION='${{ vars.cognito_region }}'
            -p COGNITO_USER_POOL_ID='${{ vars.cognito_user_pool_id }}'
            -p COGNITO_USER_POOL_CLIENT_ID='${{ vars.cognito_user_pool_client_id }}'
            -p COGNITO_DOMAIN='${{ vars.cognito_domain }}'
            -p COGNITO_OAUTH_SCOPES='${{ vars.cognito_oauth_scopes }}'
            -p COGNITO_REDIRECT_SIGN_IN='https://${{ github.event.repository.name }}-${{ inputs.target }}.${{ vars.OPENSHIFT_APPS_DOMAIN || 'apps.gold.devops.gov.bc.ca' }}'
            -p COGNITO_REDIRECT_SIGN_OUT='https://${{ github.event.repository.name }}-${{ inputs.target }}.${{ vars.OPENSHIFT_APPS_DOMAIN || 'apps.gold.devops.gov.bc.ca' }}/logout'
            -p LOGOUT_SITEMINDER_URL='${{ vars.logout_siteminder_url }}'
            -p LOGOUT_KEYCLOAK_URL='${{ vars.logout_keycloak_url }}'
            -p LOGOUT_KEYCLOAK_CLIENT_ID='${{ vars.logout_keycloak_client_id }}'
            -p FAM_CLIENT_ID='${{ vars.fam_client_id }}'
            -p FRONTEND_LOG_LEVEL='${{ vars.frontend_log_level || 'INFO' }}'
          triggers: ${{ inputs.triggers }}
          debug: true

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            # Log levels come from GitHub variables, scoped per environment
            # (test/prod); PR deploys fall back to repo-level variables, then INFO.
            parameters: >-
              -p IMAGE_TAG="${{ inputs.tag }}"
              -p APP_LOG_LEVEL='${{ vars.backend_log_level || 'INFO' }}'
              -p ROOT_LOG_LEVEL='${{ vars.backend_root_log_level || 'INFO' }}'
              -p SPRING_LOG_LEVEL='${{ vars.backend_spring_log_level || 'INFO' }}'
              -p SPRING_SECURITY_LOG_LEVEL='${{ vars.backend_spring_security_log_level || 'WARN' }}'
          # WARNING: vars referenced in this matrix resolve at repo level only —
          # GitHub evaluates strategy/matrix before the job's environment is
          # attached, so environment-scoped (test/prod) variables are ignored
          # here. Anything that differs per environment belongs in the init
          # step's parameters (common/openshift.init.yml), not in this matrix.
          # COGNITO_DOMAIN / COGNITO_REGION (Caddy CSP header) are the same
          # across environments, so it's acceptable here.
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: >-
              -p IMAGE_TAG='${{ inputs.tag }}'
              -p COGNITO_DOMAIN='${{ vars.cognito_domain }}'
              -p COGNITO_REGION='${{ vars.cognito_region }}'
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          # Lite mode strips HPA + PDB and scales to 1 replica (Recreate) for PR/sandbox deploys
          lite_mode: ${{ github.event_name == 'pull_request' }}
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p COMMIT_SHA='${{ github.sha }}'
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
