# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      backend_image:
        description: Full backend image reference, optionally pinned by digest
        default: ""
        type: string
      frontend_image:
        description: Full frontend image reference, optionally pinned by digest
        default: ""
        type: string
      source_ref:
        description: Selected tested commit whose deployment templates should be used
        default: ""
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      # Backend secrets
      spring_datasource_url:
        description: Oracle JDBC URL
        required: true
      spring_datasource_username:
        description: Oracle database username
        required: true
      spring_datasource_password:
        description: Oracle database password
        required: true
      keystore_secret:
        description: Oracle wallet init container secret
        required: true
      # Backend config
      database_host:
        description: Oracle DB hostname
        required: true
      database_service_name:
        description: Oracle service name
        required: true

      vanity_tls_certificate:
        description: PEM server certificate for the PROD vanity hostname
        required: false
      vanity_tls_key:
        description: PEM private key matching the PROD vanity certificate
        required: false
      vanity_tls_ca_certificate:
        description: PEM issuer chain for the PROD vanity certificate
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

env:
  OC_PROCESS_FLAGS: ${{ inputs.source_ref != '' && inputs.source_ref != github.sha && '--ignore-unknown-parameters' || '' }}

jobs:
  init:
    name: Deploy (init)
    environment:
      name: ${{ inputs.environment }}
      # Environment for its secrets only; deployment-result records the rollout.
      deployment: false
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # An environment secret replaces the caller's secret only when it exists. Without this
      # check, a missing environment secret would fall back to the repository-level value of the
      # same name. PR deploys use the dev environment.
      - name: Validate OpenShift namespace
        if: ${{ inputs.environment != '' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          OC_NAMESPACE: ${{ secrets.oc_namespace }}
        run: |
          if [[ "$OC_NAMESPACE" != *-"$DEPLOY_ENV" ]]; then
            echo "::error title=Wrong OpenShift namespace::oc_namespace must be the ${DEPLOY_ENV} namespace, ending in -${DEPLOY_ENV}."
            exit 1
          fi

      # Check both images before anything rolls out, so a bad frontend reference cannot leave
      # a new backend running beside the old frontend. PR deploys (dev) use their head-SHA tags.
      - name: Validate release images
        if: ${{ inputs.environment != '' && inputs.environment != 'dev' }}
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          for release in "backend=$BACKEND_IMAGE" "frontend=$FRONTEND_IMAGE"; do
            component="${release%%=*}"
            if [[ ! "${release#*=}" =~ ^"$IMAGE_REPOSITORY/$component"@sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::TEST and PROD require the repository's ${component} image pinned by SHA-256 digest."
              exit 1
            fi
          done

      # common/openshift.init.yml pastes these values into JavaScript string literals in the
      # frontend config.js, and a template cannot escape them, so each must match a strict pattern.
      - name: Validate SSO configuration
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
          OIDC_ISSUER_URI: ${{ vars.CSP_OIDC_ISSUER_URI }}
          OIDC_CLIENT_ID: ${{ vars.CSP_OIDC_CLIENT_ID }}
          OIDC_IDIR_HINT: ${{ vars.CSP_OIDC_IDIR_HINT || 'azureidir' }}
          OIDC_BCEID_HINT: ${{ vars.CSP_OIDC_BCEID_HINT || 'bceidbusiness' }}
          OIDC_SITEMINDER_LOGOUT_URL: ${{ vars.CSP_OIDC_SITEMINDER_LOGOUT_URL }}
        run: |
          if [[ ! "$OIDC_ISSUER_URI" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/(auth/)?realms/[A-Za-z0-9._-]+$ ]] ||
             [[ ! "$OIDC_CLIENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::CSP_OIDC_ISSUER_URI and CSP_OIDC_CLIENT_ID must identify the provisioned CSS client"
            exit 1
          fi
          # Each environment trusts only its own SSO realm, so a copied issuer cannot make PROD
          # accept DEV or TEST tokens.
          case "$DEPLOY_ENV" in
            prod) sso_host=loginproxy.gov.bc.ca ;;
            test) sso_host=test.loginproxy.gov.bc.ca ;;
            *) sso_host=dev.loginproxy.gov.bc.ca ;;
          esac
          if [[ "$OIDC_ISSUER_URI" != "https://$sso_host/"* ]]; then
            echo "::error::CSP_OIDC_ISSUER_URI must be the $DEPLOY_ENV SSO realm on $sso_host"
            exit 1
          fi
          if [[ ! "$OIDC_IDIR_HINT" =~ ^[A-Za-z0-9_-]+$ ]] || [[ ! "$OIDC_BCEID_HINT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CSP_OIDC_IDIR_HINT and CSP_OIDC_BCEID_HINT must be identity provider aliases"
            exit 1
          fi
          # Optional: blank selects the logontest7/logon7 default in the frontend.
          if [[ -n "$OIDC_SITEMINDER_LOGOUT_URL" ]] &&
             [[ ! "$OIDC_SITEMINDER_LOGOUT_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$ ]]; then
            echo "::error::CSP_OIDC_SITEMINDER_LOGOUT_URL must be an https URL without a query or fragment"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Stage init template
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-templates"
          cp common/openshift.init.yml "$RUNNER_TEMP/deploy-templates/init.yml"
      - name: Validate PROD settings
        if: ${{ inputs.target == 'prod' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          VANITY_HOST: ${{ vars.VANITY_HOST }}
          VANITY_TLS_CERTIFICATE: ${{ secrets.vanity_tls_certificate }}
          VANITY_TLS_KEY: ${{ secrets.vanity_tls_key }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.vanity_tls_ca_certificate }}
        run: |
          set -euo pipefail
          # The namespace check above then requires a -prod namespace.
          if [[ "$DEPLOY_ENV" != prod ]]; then
            echo "::error::PROD requires the prod GitHub Environment"
            exit 1
          fi
          for setting in VANITY_HOST VANITY_TLS_CERTIFICATE VANITY_TLS_KEY VANITY_TLS_CA_CERTIFICATE; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::${setting} must be configured in the prod GitHub Environment"
              exit 1
            fi
          done
          if [[ ! "$VANITY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]; then
            echo "::error::VANITY_HOST must be a hostname without a scheme or path"
            exit 1
          fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.spring_datasource_url }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.spring_datasource_username }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.spring_datasource_password }}
          KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
          DATABASE_HOST: ${{ secrets.database_host }}
          DATABASE_SERVICE_NAME: ${{ secrets.database_service_name }}
        with:
          file: ${{ runner.temp }}/deploy-templates/init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters:
            -p ZONE='${{ inputs.target }}'
            -p NAME='${{ github.event.repository.name }}'
            -p SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL"
            -p SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME"
            -p SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"
            -p DATABASE_HOST="$DATABASE_HOST"
            -p DATABASE_SERVICE_NAME="$DATABASE_SERVICE_NAME"
            -p FRONTEND_LOG_LEVEL='${{ vars.frontend_log_level || 'INFO' }}'
            -p CSP_OIDC_ISSUER_URI='${{ vars.CSP_OIDC_ISSUER_URI }}'
            -p CSP_OIDC_CLIENT_ID='${{ vars.CSP_OIDC_CLIENT_ID }}'
            -p APP_ENV='${{ inputs.environment || 'dev' }}'
            -p OIDC_IDIR_HINT='${{ vars.CSP_OIDC_IDIR_HINT || 'azureidir' }}'
            -p OIDC_BCEID_HINT='${{ vars.CSP_OIDC_BCEID_HINT || 'bceidbusiness' }}'
            -p OIDC_SITEMINDER_LOGOUT_URL='${{ vars.CSP_OIDC_SITEMINDER_LOGOUT_URL }}'
            $OC_PROCESS_FLAGS
          debug: false
          triggers: ${{ inputs.triggers }}

  deploy:
    name: Deploy (${{ matrix.name }})
    environment:
      name: ${{ inputs.environment }}
      # Environment for its secrets only; deployment-result records the rollout.
      deployment: false
    needs: [init]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      # Roll out the backend before the frontend: one leg at a time in matrix order, and
      # fail-fast cancels the queued frontend leg if the backend leg fails.
      max-parallel: 1
      fail-fast: true
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            parameters: >-
              -p APP_LOG_LEVEL='${{ vars.backend_log_level || 'INFO' }}'
              -p ROOT_LOG_LEVEL='${{ vars.backend_root_log_level || 'INFO' }}'
              -p SPRING_LOG_LEVEL='${{ vars.backend_spring_log_level || 'INFO' }}'
              -p SPRING_SECURITY_LOG_LEVEL='${{ vars.backend_spring_security_log_level || 'WARN' }}'
          # WARNING: vars referenced in this matrix resolve at repo level only —
          # GitHub evaluates strategy/matrix before the job's environment is
          # attached, so environment-scoped (test/prod) variables are ignored
          # here. Anything that differs per environment belongs in the init
          # step's parameters (common/openshift.init.yml), not in this matrix.
          # The frontend takes no extra parameters: its auth settings are read
          # from the init-created ConfigMaps, per environment.
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    env:
      IMAGE_REF: ${{ matrix.name == 'backend' && (inputs.backend_image || format('ghcr.io/{0}/backend:{1}', github.repository, inputs.tag)) || (inputs.frontend_image || format('ghcr.io/{0}/frontend:{1}', github.repository, inputs.tag)) }}
      VANITY_HOST: ${{ vars.VANITY_HOST }}
      APPS_DOMAIN: ${{ vars.OPENSHIFT_APPS_DOMAIN || 'apps.gold.devops.gov.bc.ca' }}
    steps:
      # Each job resolves its environment secrets separately; see the init job.
      - name: Validate OpenShift namespace
        if: ${{ inputs.environment != '' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          OC_NAMESPACE: ${{ secrets.oc_namespace }}
        run: |
          if [[ "$OC_NAMESPACE" != *-"$DEPLOY_ENV" ]]; then
            echo "::error title=Wrong OpenShift namespace::oc_namespace must be the ${DEPLOY_ENV} namespace, ending in -${DEPLOY_ENV}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Stage deployment templates
        env:
          COMPONENT: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-templates"
          cp "$COMPONENT/openshift.deploy.yml" "$RUNNER_TEMP/deploy-templates/$COMPONENT.yml"
          if [[ "$COMPONENT" == frontend ]]; then
            cp frontend/openshift.route.yml "$RUNNER_TEMP/deploy-templates/route.yml"
            cp frontend/openshift.vanity-route.yml "$RUNNER_TEMP/deploy-templates/vanity-route.yml"
          fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: ${{ runner.temp }}/deploy-templates/${{ matrix.name }}.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Lite mode strips HPA + PDB and scales to 1 replica (Recreate) for PR/sandbox deploys
          lite_mode: ${{ github.event_name == 'pull_request' }}
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p COMMIT_SHA='${{ inputs.source_ref || github.sha }}'
            -p IMAGE_REF="$IMAGE_REF"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            ${{ matrix.parameters }}
            $OC_PROCESS_FLAGS
          triggers: ${{ inputs.triggers }}

      - name: Default Route (non-PROD)
        if: ${{ matrix.name == 'frontend' && inputs.target != 'prod' }}
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        with:
          file: ${{ runner.temp }}/deploy-templates/route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          debug: false
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p DOMAIN="$APPS_DOMAIN"
          triggers: ${{ inputs.triggers }}
      - name: Vanity Route (PROD)
        if: ${{ matrix.name == 'frontend' && inputs.target == 'prod' }}
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        env:
          VANITY_TLS_CERTIFICATE: ${{ secrets.vanity_tls_certificate }}
          VANITY_TLS_KEY: ${{ secrets.vanity_tls_key }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.vanity_tls_ca_certificate }}
        with:
          file: ${{ runner.temp }}/deploy-templates/vanity-route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          debug: false
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p VANITY_HOST="$VANITY_HOST"
            -p VANITY_TLS_CERTIFICATE="$VANITY_TLS_CERTIFICATE"
            -p VANITY_TLS_KEY="$VANITY_TLS_KEY"
            -p VANITY_TLS_CA_CERTIFICATE="$VANITY_TLS_CA_CERTIFICATE"
            $OC_PROCESS_FLAGS

  # One deployment record per rollout. init and both deploy legs attach the
  # environment only for its secrets: recording on each of them showed every
  # deploy three times on the PR timeline. Skipped when the triggers matched
  # nothing (nothing was rolled out) and for PROD, which Release PROD records
  # against the tagged commit itself.
  deployment-result:
    name: Record deployment result
    needs: [init, deploy]
    if: ${{ !cancelled() && inputs.target != 'prod' && needs.init.outputs.triggered != 'false' }}
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail incomplete deployments
        if: ${{ needs.init.result != 'success' || needs.deploy.result != 'success' }}
        run: |
          echo "Init deployment result: ${{ needs.init.result }}"
          echo "Backend/frontend deployment result: ${{ needs.deploy.result }}"
          exit 1

      - name: Confirm deployment
        run: echo "Init, backend and frontend deployments succeeded."
