name: Release PROD
run-name: Release ${{ inputs.release_tag }} to PROD by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag on main whose Merge workflow passed TEST
        required: true
        type: string

concurrency:
  group: csp-prod-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Verify tested release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve successful TEST run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node .github/scripts/release-images.mjs resolve
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          name: release-candidate-${{ steps.release.outputs.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Validate tested image manifest
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TEST_RUN_ID: ${{ steps.release.outputs.run_id }}
          TEST_RUN_ATTEMPT: ${{ steps.release.outputs.run_attempt }}
        run: node .github/scripts/release-images.mjs validate "$RUNNER_TEMP/release-candidate/release-candidate.json"

  deploy-prod:
    name: PROD Deploy (${{ inputs.release_tag }})
    needs: [prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      spring_datasource_url: ${{ secrets.spring_datasource_url }}
      spring_datasource_username: ${{ secrets.spring_datasource_username }}
      spring_datasource_password: ${{ secrets.spring_datasource_password }}
      keystore_secret: ${{ secrets.keystore_secret }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      jwt_jwks_uri: ${{ secrets.jwt_jwks_uri }}
      jwt_issuer: ${{ secrets.jwt_issuer }}
      jwt_audience: ${{ secrets.jwt_audience }}
      vanity_tls_certificate: ${{ secrets.VANITY_TLS_CERTIFICATE }}
      vanity_tls_key: ${{ secrets.VANITY_TLS_KEY }}
      vanity_tls_ca_certificate: ${{ secrets.VANITY_TLS_CA_CERTIFICATE }}
    with:
      environment: prod
      target: prod
      tag: ${{ inputs.release_tag }}
      backend_image: ${{ needs.prepare.outputs.backend_image }}
      frontend_image: ${{ needs.prepare.outputs.frontend_image }}
      source_ref: ${{ needs.prepare.outputs.sha }}

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset; alert templates live in monitoring/alerts/.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod, prepare]
    runs-on: ubuntu-24.04
    environment:
      name: prod
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: bcgov/action-sysdig-monitor@6806bcb6b427359881848a62508402f5c1bb0dc9 # 0.0.3
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ secrets.oc_namespace }}
          app: nr-csp

  record-deployment:
    name: Record released commit
    needs: [prepare, deploy-prod]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: prod
      deployment: false
    permissions:
      deployments: write
    steps:
      - name: Record release result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          DEPLOYMENT_STATE: ${{ needs.deploy-prod.result == 'success' && 'success' || 'failure' }}
          VANITY_HOST: ${{ vars.VANITY_HOST }}
        run: |
          deployment_id="$(jq -n --arg ref "$RELEASE_SHA" \
            '{ref: $ref, environment: "prod", production_environment: true, auto_merge: false, required_contexts: []}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state="$DEPLOYMENT_STATE" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f environment_url="https://$VANITY_HOST" \
            -f description="Manual tagged release; see run summary for tested image digests" \
            --silent
