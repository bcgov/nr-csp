# JasperReports 7 only registers query-executer factories for sql/xPath/csv/json/jsonql by
# default (confirmed against jasperreports-7.0.4.jar's default.jasperreports.properties) — the
# R06-R12 report designs use <query language="plsql"> to call Oracle stored procedures via a
# REF_CURSOR OUT parameter, so without this alias JasperFillManager.fillReport() throws before
# ever reaching the database. PlsqlQueryExecuterFactory is a thin subclass of the standard JDBC
# factory that also relaxes the compile-time parameter-type allow-list to permit
# java.sql.ResultSet (the REPORT_CURSOR OUT parameter) — see its Javadoc for why a plain alias
# to JRJdbcQueryExecuterFactory isn't enough.
net.sf.jasperreports.query.executer.factory.plsql=ca.bc.gov.nrs.csp.backend.config.PlsqlQueryExecuterFactory
net.sf.jasperreports.query.executer.factory.PLSQL=ca.bc.gov.nrs.csp.backend.config.PlsqlQueryExecuterFactory

# JasperReports' own built-in net.sf.jasperreports.engine.query.OracleProcedureCallHandlerFactory
# (the default registered value for this property) claims to provide Oracle REF CURSOR binding,
# but its createProcedureCallHandler() reflectively loads
# com.jaspersoft.jasperreports.plsql.OracleProcedureCallHandler — a class that does not exist in
# the open-source jasperreports artifact (confirmed by decompiling jasperreports-7.0.4.jar; not
# published on Maven Central either). The ClassNotFoundException is swallowed silently and the
# factory returns null, which makes JRJdbcQueryExecuter treat every {call ...} query as a plain
# SELECT — it prepares a PreparedStatement instead of a CallableStatement, and the REPORT_CURSOR
# OUT parameter (java.sql.ResultSet, no IN value) falls through to a generic binding path that
# fails with "ORA-17004: Invalid column type: 2000" (java.sql.Types.JAVA_OBJECT). This affects
# every stored-procedure report in this codebase (R06-R12), since they all declare REPORT_CURSOR
# the same way — see RefCursorProcedureCallHandlerFactory's Javadoc for the full mechanism.
net.sf.jasperreports.jdbc.procedure.call.handler.factory=ca.bc.gov.nrs.csp.backend.config.RefCursorProcedureCallHandlerFactory
