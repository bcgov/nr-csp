# Registers fonts.xml as a JasperReports font-extension source (auto-loaded from the classpath
# root, independent of Spring, same as jasperreports.properties). See fonts.xml for why this is
# needed — without it, PDF export silently ignores bold/italic on every locally-rendered report.
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.csp=fonts.xml
