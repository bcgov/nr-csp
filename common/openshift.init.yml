apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-csp
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  # ── Backend secrets ───────────────────────────────────────
  - name: SPRING_DATASOURCE_URL
    description: "Full Oracle JDBC URL, e.g. jdbc:oracle:thin:@//host:1543/SERVICE"
    required: true
  - name: SPRING_DATASOURCE_USERNAME
    description: Oracle database username
    required: true
  - name: SPRING_DATASOURCE_PASSWORD
    description: Oracle database password
    required: true
  - name: KEYSTORE_SECRET
    description: Secret used by the Oracle wallet init container
    required: true

  # ── Backend config ────────────────────────────────────────
  - name: DATABASE_HOST
    description: Oracle DB hostname used by the wallet init container
    required: true
  - name: DATABASE_SERVICE_NAME
    description: Oracle service name
    required: true
  - name: SPRING_PROFILES_ACTIVE
    description: Active Spring profile
    value: prod
  - name: JAVA_OPTS
    description: JVM options
    value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
  - name: JWT_JWKS_URI
    description: JWKS endpoint for JWT validation
    value: ""
  - name: JWT_ISSUER
    description: Expected JWT issuer claim
    value: ""
  - name: JWT_AUDIENCE
    description: Expected JWT audience claim
    value: ""
  - name: AUTH_MOCK_ENABLED
    description: Set to true to bypass real authentication (local/dev only)
    value: "false"
  - name: AUTH_MOCK_ROLES
    description: Comma-separated roles injected when AUTH_MOCK_ENABLED=true
    value: ""

  # ── Frontend amplify config ───────────────────────────────
  # Lives here (not in frontend/openshift.deploy.yml) so the values are
  # processed by the init step, where environment-scoped GitHub variables
  # resolve. The deploy job reads vars inside a matrix, which GitHub
  # evaluates before the environment is attached — env-scoped values are
  # silently ignored there.
  - name: APP_ENV
    description: Application environment label (dev, test, prod)
    value: dev
  - name: COGNITO_IDP_NAME
    description: Cognito identity provider name (DEV-IDIR, TEST-IDIR, PROD-IDIR)
    value: DEV-IDIR
  - name: COGNITO_IDP_NAME_BCEID
    description: Cognito identity provider name for BCeID sign-in (DEV-BCEID, TEST-BCEID, PROD-BCEID)
    value: DEV-BCEID
  - name: COGNITO_REGION
    description: AWS region for Cognito
    value: ca-central-1
  - name: COGNITO_USER_POOL_ID
    description: Cognito user pool ID
    required: true
  - name: COGNITO_USER_POOL_CLIENT_ID
    description: Cognito app client ID (differs per environment)
    required: true
  - name: COGNITO_DOMAIN
    description: Cognito hosted UI domain (no https://)
    required: true
  - name: COGNITO_OAUTH_SCOPES
    description: Comma-separated OAuth scopes
    value: openid,profile,email
  - name: COGNITO_REDIRECT_SIGN_IN
    description: Post-login redirect URL
    required: true
  # Cognito validates logout_uri by exact string match against the FAM client's
  # registered sign-out URLs (FAM repo: lza-infrastructure/terraform/server/
  # oidc_clients_csp.tf), so this plain <app>/logout URL must be registered
  # there verbatim or Cognito bounces the user to /login with "Required
  # parameters missing". The frontend builds the full federated logout chain
  # (SiteMinder → Keycloak → Cognito → this URL) at runtime from the
  # LOGOUT_* parameters below — see frontend/src/utils/logoutChain.ts.
  - name: COGNITO_REDIRECT_SIGN_OUT
    description: Post-logout redirect URL (plain <app>/logout, FAM-registered)
    required: true
  - name: LOGOUT_SITEMINDER_URL
    description: SiteMinder logoff.cgi base URL (first hop of the logout chain)
    value: ""
  - name: LOGOUT_KEYCLOAK_URL
    description: Keycloak end-session endpoint (second hop of the logout chain)
    value: ""
  - name: LOGOUT_KEYCLOAK_CLIENT_ID
    description: FAM's shared Keycloak client id (fsa-cognito-idir-…)
    value: ""
  - name: FAM_CLIENT_ID
    description: FAM application client ID (Cognito group prefix, e.g. CSP)
    required: true
  - name: FRONTEND_LOG_LEVEL
    description: Caddy runtime log level (DEBUG, INFO, WARN, ERROR)
    value: INFO

objects:
  # ── Backend Secret ────────────────────────────────────────
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      KEYSTORE_SECRET: ${KEYSTORE_SECRET}

  # ── Backend ConfigMap ─────────────────────────────────────
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    data:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_SERVICE_NAME: ${DATABASE_SERVICE_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_OPTS: ${JAVA_OPTS}
      JWT_JWKS_URI: ${JWT_JWKS_URI}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED}
      AUTH_MOCK_ROLES: ${AUTH_MOCK_ROLES}

  # ── Frontend env ConfigMap (mirrors ${NAME}-${ZONE}-backend) ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    data:
      LOG_LEVEL: ${FRONTEND_LOG_LEVEL}

  # ── Frontend amplify ConfigMap (runtime-injected, overrides the
  #    build-time placeholder; mounted by the frontend Deployment) ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-frontend-amplify-config-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    data:
      amplify-config.js: |
        window.amplifyConfig = {
          "appEnv": "${APP_ENV}",
          "idpName": "${COGNITO_IDP_NAME}",
          "idpNameBceid": "${COGNITO_IDP_NAME_BCEID}",
          "region": "${COGNITO_REGION}",
          "userPoolId": "${COGNITO_USER_POOL_ID}",
          "userPoolClientId": "${COGNITO_USER_POOL_CLIENT_ID}",
          "cognitoDomain": "${COGNITO_DOMAIN}",
          "oauthScopes": "${COGNITO_OAUTH_SCOPES}".split(','),
          "redirectSignIn": "${COGNITO_REDIRECT_SIGN_IN}",
          "redirectSignOut": "${COGNITO_REDIRECT_SIGN_OUT}",
          "logoutSiteminderUrl": "${LOGOUT_SITEMINDER_URL}",
          "logoutKeycloakUrl": "${LOGOUT_KEYCLOAK_URL}",
          "logoutKeycloakClientId": "${LOGOUT_KEYCLOAK_CLIENT_ID}",
          "mockUser": false,
          "famClientId": "${FAM_CLIENT_ID}"
        };

  # ── NetworkPolicy: ingress from OpenShift router ──────────
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-frontend-${ZONE}-ingress
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress

  # ── NetworkPolicy: ingress from same-zone frontend + cluster monitoring ──
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-backend-${ZONE}-ingress
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-frontend-${ZONE}
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: monitoring
      policyTypes:
        - Ingress
